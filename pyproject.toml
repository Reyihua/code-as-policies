[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coap-reproduction"
version = "0.1.0"
description = "Independent, sensor-only COAP algorithm reproduction"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.scripts]
coap-evaluate = "coap.evaluate:main"

[tool.setuptools.packages.find]
include = ["coap*"]
