name: tests
on: [push, pull_request]
jobs:
  numeric-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m coap.evaluate --episodes 6 --output /tmp/coap-numeric.json
